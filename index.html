<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>预售返单库存管控台</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f6f4;--panel:#fff;--panel-2:#fafaf8;--line:#e5e3de;--line-soft:#eeece8;
  --tx:#1d1c1a;--tx-2:#6b6862;--tx-3:#9c988f;
  --accent:#b8522c;--accent-soft:#fbeee8;
  --ok:#2e7d5b;--ok-soft:#e9f4ef;
  --warn:#9a6a10;--warn-soft:#fbf2de;
  --danger:#b3372f;--danger-soft:#fbeae8;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16161a;--panel:#1e1e23;--panel-2:#26262c;--line:#33333c;--line-soft:#2b2b32;
  --tx:#eceae6;--tx-2:#a6a39d;--tx-3:#76736d;
  --accent:#e08159;--accent-soft:#3a2319;--ok:#6cc39a;--ok-soft:#1c3129;
  --warn:#dcae57;--warn-soft:#332a17;--danger:#e8807a;--danger-soft:#3a201e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#16161a;--panel:#1e1e23;--panel-2:#26262c;--line:#33333c;--line-soft:#2b2b32;
  --tx:#eceae6;--tx-2:#a6a39d;--tx-3:#76736d;
  --accent:#e08159;--accent-soft:#3a2319;--ok:#6cc39a;--ok-soft:#1c3129;
  --warn:#dcae57;--warn-soft:#332a17;--danger:#e8807a;--danger-soft:#3a201e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 100px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:8px 14px;border-radius:10px;font-size:14px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx-2);padding:7px 9px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}

header.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header.top h1{font-size:19px;margin:0;letter-spacing:-.01em}
.spacer{flex:1}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 13px;box-shadow:var(--shadow)}
.card .k{font-size:12px;color:var(--tx-2);margin-bottom:4px}
.card .v{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.card .s{font-size:11.5px;color:var(--tx-3);margin-top:2px}
.card.a .v{color:var(--accent)} .card.d .v{color:var(--danger)} .card.g .v{color:var(--ok)}

.style{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:11px;box-shadow:var(--shadow);overflow:hidden}
.style.risk{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.sh{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.caret{color:var(--tx-3);font-size:10px;transition:transform .15s;flex:none}
.style.open .caret{transform:rotate(90deg)}
.shmain{flex:1;min-width:0}
.sname{font-weight:600;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ssub{font-size:12px;color:var(--tx-2);margin-top:2px}
.ssub b{color:var(--tx)}
.shnum{text-align:right;flex:none}
.shnum .n{font-size:20px;font-weight:700;line-height:1.1;color:var(--accent)}
.shnum .n.z{color:var(--tx-3);font-weight:500}
.shnum .l{font-size:11px;color:var(--tx-3)}
.sbody{display:none;border-top:1px solid var(--line-soft)}
.style.open .sbody{display:block}

.sizes{padding:4px 0}
.sz{display:grid;grid-template-columns:52px 1fr 74px;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.sz:last-child{border-bottom:none}
.szn{font-weight:700;font-size:15px}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.f{display:flex;flex-direction:column;gap:3px}
.f .lb{font-size:10.5px;color:var(--tx-3);text-align:center;letter-spacing:.02em}
.f input{
  width:100%;padding:7px 4px;text-align:center;border:1px solid var(--line);border-radius:8px;
  background:var(--panel-2);color:var(--tx);font:inherit;font-size:15px;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;
}
.f input::-webkit-outer-spin-button,.f input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.f input:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.f.key input{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));font-weight:600}
.f.key .lb{color:var(--accent)}
.res{text-align:right}
.res .n{font-size:21px;font-weight:700;color:var(--accent);line-height:1.1}
.res .n.z{color:var(--tx-3);font-weight:500;font-size:18px}
.res .t{font-size:10.5px;color:var(--tx-3);margin-top:1px}
.res .t.dan{color:var(--danger)}
.res .t.ok{color:var(--ok)}
@media(max-width:540px){
  .sz{grid-template-columns:1fr auto;gap:8px 10px;padding:12px 13px}
  .szn{font-size:16px}
  .fields{grid-column:1/-1;order:3}
  .res{order:2}
  .f input{padding:9px 4px;font-size:16px}
}
.tools{display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px;background:var(--panel-2);border-top:1px solid var(--line-soft)}
.tools .right{margin-left:auto}
.meta{padding:10px 14px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--tx-2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.meta b{color:var(--tx)}
.tip{padding:10px 14px;font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-top:1px solid var(--line-soft)}
.tip.d{background:var(--danger-soft);color:var(--danger)}

.empty{text-align:center;padding:50px 20px;color:var(--tx-2);border:1px dashed var(--line);border-radius:14px;background:var(--panel)}
.empty h3{margin:0 0 6px;font-size:16px;color:var(--tx)}
.empty p{margin:0 0 16px;font-size:13.5px}
.note{font-size:12.5px;color:var(--tx-2);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 13px;margin-bottom:16px}
.note b{color:var(--tx)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:541px){.modal-bg{align-items:center;padding:18px}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-height:88vh;overflow:auto}
@media(min-width:541px){.modal{border-radius:15px;width:min(460px,100%);padding:20px}}
.modal h3{margin:0 0 14px;font-size:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--tx-2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--tx);font:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field .hint{font-size:11.5px;color:var(--tx-3);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
pre.out{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;white-space:pre-wrap;margin:0;font-family:ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 17px;border-radius:999px;font-size:13.5px;z-index:99;opacity:0;transition:.2s;pointer-events:none;max-width:88vw;text-align:center}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--tx-2);font-size:13.5px;cursor:pointer;transition:.12s}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.drop .big{font-size:26px;margin-bottom:6px}
.impList{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.impRow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-soft);font-size:13px}
.impRow:last-child{border-bottom:none}
.impRow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.impRow .ct{color:var(--tx-3);font-size:11.5px;flex:none}
.impRow .tag{font-size:11px;padding:2px 7px;border-radius:6px;flex:none}
.impRow .tag.new{background:var(--accent-soft);color:var(--accent)}
.impRow .tag.upd{background:var(--ok-soft);color:var(--ok)}
.impSummary{font-size:13px;color:var(--tx-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>预售返单库存管控台</h1>
    <div class="spacer"></div>
    <button class="btn ghost" id="themeBtn">◐</button>
    <button class="btn ghost" id="exportBtn" title="导出 CSV">↓</button>
    <button class="btn sm" id="importBtn">导入备货单</button>
    <button class="btn primary sm" id="addBtn">+ 款式</button>
  </header>

  <div class="note">
    每个尺码只填 4 个数：<b>待发货</b>（抖音后台）、<b>退货中</b>（售后里正在退回来的）、<b>库存</b>、<b>在产</b>。
    右边的大数字就是该让工厂做的量。
  </div>

  <div class="cards" id="cards"></div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var n=function(v){v=Number(v);return isFinite(v)?v:0;};
var i0=function(v){return Math.max(0,Math.round(n(v)));};
var fmt=function(v){return Math.round(n(v)).toLocaleString('zh-CN');};
var money=function(v){return '¥'+Math.round(n(v)).toLocaleString('zh-CN');};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}

var DB=null, LS='presale_stock_v2', state={styles:[],open:{},ready:false}, editing=false, tombs={};

/* ---------- 存储 ---------- */
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(state.styles));}catch(e){}}
function lsLoad(){try{var r=localStorage.getItem(LS);if(r)return JSON.parse(r);
  var old=localStorage.getItem('presale_stock_v1');return old?migrate(JSON.parse(old)):[];}catch(e){return [];}}
function migrate(arr){
  return (arr||[]).map(function(st){
    st.sizes=(st.sizes||[]).map(function(s){
      if(s.pending==null) s.pending=Math.max(0,i0(s.ordered)-i0(s.shipped));
      if(s.returning==null) s.returning=0;
      s.stock=i0(s.stock); s.inProd=i0(s.inProd);
      st.shippedTotal=i0(st.shippedTotal)+i0(s.shipped);
      st.returnedTotal=i0(st.returnedTotal)+i0(s.returned);
      delete s.ordered; delete s.shipped; delete s.returned;
      return s;
    });
    return st;
  });
}
var timers={};
function persist(st){
  lsSave(); if(!DB||!st) return;
  clearTimeout(timers[st.id]);
  timers[st.id]=setTimeout(function(){
    try{DB.doc('styles/'+st.id).set(JSON.parse(JSON.stringify(st))).catch(function(){});}catch(e){}
  },400);
}
function dropDoc(id){tombs[id]=Date.now();lsSave();if(DB){try{DB.doc('styles/'+id).delete().catch(function(){});}catch(e){}}}

/* ---------- 计算 ---------- */
function calcSize(st,s){
  var pending=i0(s.pending), returning=i0(s.returning), stock=i0(s.stock), inProd=i0(s.inProd);
  var resale=Math.min(1,Math.max(0,n(st.resaleRate==null?90:st.resaleRate)/100));
  var back=Math.floor(returning*resale);          // 退货中、能二次销售的
  var supply=stock+inProd+back;
  var gap=pending-supply;
  var buf=Math.max(0,n(st.buffer)/100);
  return {pending:pending,returning:returning,stock:stock,inProd:inProd,back:back,
    suggest:gap>0?Math.ceil(gap*(1+buf)):0, over:gap<0?-gap:0};
}
function calcStyle(st){
  var rows=st.sizes.map(function(s){return calcSize(st,s);});
  var t={pending:0,returning:0,stock:0,inProd:0,back:0,suggest:0,over:0};
  rows.forEach(function(x){for(var k in t)t[k]+=x[k];});
  t.cost=t.suggest*n(st.cost);
  t.dead=t.over*n(st.cost);
  var sh=i0(st.shippedTotal), rt=i0(st.returnedTotal);
  t.rate=sh>0?rt/sh:null; t.shipped=sh; t.returned=rt;
  // 这批待发货发出后，按历史退货率预计还会退回来的件数
  t.futureBack=t.rate!=null?Math.round(t.pending*t.rate*Math.min(1,Math.max(0,n(st.resaleRate==null?90:st.resaleRate)/100))):null;
  return {rows:rows,total:t};
}

/* ---------- 渲染 ---------- */
function render(){renderCards();renderList();}
function renderCards(){
  var live=state.styles.filter(function(s){return !s.archived;});
  var T={pending:0,suggest:0,over:0,cost:0,dead:0,stock:0,inProd:0,sh:0,rt:0,returning:0};
  live.forEach(function(st){var c=calcStyle(st).total;
    T.pending+=c.pending;T.suggest+=c.suggest;T.over+=c.over;T.cost+=c.cost;T.dead+=c.dead;
    T.stock+=c.stock;T.inProd+=c.inProd;T.returning+=c.returning;T.sh+=c.shipped;T.rt+=c.returned;});
  var rr=T.sh>0?Math.round(T.rt/T.sh*1000)/10:0;
  document.getElementById('cards').innerHTML=
     cd('待发货',fmt(T.pending)+' 件',live.length+' 个在售款')
    +cd('该做的货',fmt(T.suggest)+' 件','投入 '+money(T.cost),T.suggest>0?'a':'')
    +cd('过量风险',fmt(T.over)+' 件','占压 '+money(T.dead),T.over>0?'d':'g')
    +cd('库存+在产',fmt(T.stock+T.inProd)+' 件',fmt(T.stock)+' 现货 / '+fmt(T.inProd)+' 在产')
    +cd('退货率',rr+'%',T.rt+' / '+T.sh+' 件',rr>=35?'d':'');
}
function cd(k,v,s,c){return '<div class="card '+(c||'')+'"><div class="k">'+k+'</div><div class="v num">'+v+'</div><div class="s num">'+s+'</div></div>';}

function renderList(){
  var el=document.getElementById('list');
  if(!state.styles.length){
    el.innerHTML='<div class="empty"><h3>还没有款式</h3><p>新建一个款，填上各尺码的待发货数量。</p>'
      +'<button class="btn primary" id="e2">+ 新建款式</button></div>';
    document.getElementById('e2').onclick=function(){styleForm(null);};
    return;
  }
  var arr=state.styles.slice().sort(function(a,b){
    if(!!a.archived!==!!b.archived)return a.archived?1:-1;
    return (b.createdAt||0)-(a.createdAt||0);});
  el.innerHTML=arr.map(styleHTML).join('');
  bind();
}

function styleHTML(st){
  var c=calcStyle(st), t=c.total, open=!!state.open[st.id];
  var risky=t.over>0||(t.rate!=null&&t.rate>=0.4);
  var sizes=st.sizes.map(function(s,i){
    var x=c.rows[i];
    var tag = x.suggest>0 ? '<div class="t">要做的货</div>'
            : x.over>0 ? '<div class="t dan">多 '+fmt(x.over)+' 件</div>'
            : '<div class="t ok">够了</div>';
    return '<div class="sz" data-row="'+st.id+':'+i+'">'
      +'<div class="szn">'+esc(s.name)+'</div>'
      +'<div class="fields">'
        +fld(st.id,i,'pending','待发货',s.pending,1)
        +fld(st.id,i,'returning','退货中',s.returning,0)
        +fld(st.id,i,'stock','库存',s.stock,0)
        +fld(st.id,i,'inProd','在产',s.inProd,0)
      +'</div>'
      +'<div class="res"><div class="n '+(x.suggest?'':'z')+'">'+fmt(x.suggest)+'</div>'+tag+'</div>'
      +'</div>';
  }).join('');

  var sub='待发 <b class="num">'+fmt(t.pending)+'</b> · 库存 <b class="num">'+fmt(t.stock)+'</b> · 在产 <b class="num">'+fmt(t.inProd)+'</b>'
    +(t.rate!=null?' · 退货率 <b class="num">'+Math.round(t.rate*1000)/10+'%</b>':'')
    +(st.archived?' · 已归档':'');

  var tips='';
  if(t.over>0) tips+='<div class="tip d">已有 '+fmt(t.over)+' 件超出订单需求，占压 '+money(t.dead)+'，别再追单了。</div>';
  if(t.futureBack>0&&t.suggest>0) tips+='<div class="tip">按 '+Math.round(t.rate*1000)/10+'% 的退货率，这 '+fmt(t.pending)+' 件发出后预计还会退回约 '+fmt(t.futureBack)+' 件。若预售已结束，做完这批就别再补了。</div>';

  return '<div class="style '+(open?'open':'')+' '+(risky?'risk':'')+'" data-style="'+st.id+'">'
   +'<div class="sh" data-toggle="'+st.id+'">'
     +'<span class="caret">▶</span>'
     +'<div class="shmain"><span class="sname">'+esc(st.name)+'</span><div class="ssub">'+sub+'</div></div>'
     +'<div class="shnum"><div class="n '+(t.suggest?'':'z')+'">'+fmt(t.suggest)+'</div><div class="l">该做的货</div></div>'
   +'</div>'
   +'<div class="sbody">'
     +'<div class="sizes">'+sizes+'</div>'
     +tips
     +'<div class="tools">'
       +'<button class="btn sm primary" data-act="order" data-sid="'+st.id+'">生成生产单</button>'
       +'<button class="btn sm" data-act="paste" data-sid="'+st.id+'">批量填待发货</button>'
       +'<button class="btn sm" data-act="arrive" data-sid="'+st.id+'">在产到货</button>'
       +'<button class="btn sm" data-act="ship" data-sid="'+st.id+'">发货</button>'
       +'<button class="btn sm" data-act="rback" data-sid="'+st.id+'">退货入库</button>'
       +'<button class="btn sm" data-act="more" data-sid="'+st.id+'">⋯</button>'
     +'</div>'
     +'<div class="meta">成本 <b>'+money(n(st.cost))+'</b>/件 · 累计发货 <b class="num">'+fmt(t.shipped)+'</b> · 累计退货 <b class="num">'+fmt(t.returned)+'</b>'
       +' · 退货可二次销售 <b>'+(st.resaleRate==null?90:n(st.resaleRate))+'%</b>'
       +(n(st.buffer)?' · 安全余量 <b>'+n(st.buffer)+'%</b>':'')+'</div>'
   +'</div></div>';
}
function fld(sid,i,f,label,val,key){
  return '<div class="f'+(key?' key':'')+'"><span class="lb">'+label+'</span>'
    +'<input type="number" inputmode="numeric" min="0" step="1" value="'+i0(val)+'" data-sid="'+sid+'" data-idx="'+i+'" data-f="'+f+'"></div>';
}

/* 局部刷新，避免输入时失焦 */
function refresh(st){
  var root=document.querySelector('.style[data-style="'+st.id+'"]'); if(!root) return;
  var c=calcStyle(st), t=c.total;
  root.querySelectorAll('.sz').forEach(function(row,i){
    var x=c.rows[i]; if(!x) return;
    var r=row.querySelector('.res');
    r.innerHTML='<div class="n '+(x.suggest?'':'z')+'">'+fmt(x.suggest)+'</div>'

// 解析抖音后台导出的"备货单"（实际是 HTML 表格，后缀常为 .xlsx）
function parseStockSheet(text){
  var doc;
  try{ doc = new DOMParser().parseFromString(text, 'text/html'); }catch(e){ return null; }
  var table = doc.querySelector('table');
  if(!table) return null;
  var trs = table.querySelectorAll('tr');
  var products = [], cur = null;
  function parseSpec(spec){
    var m = spec.match(/^(.*?)\s*[:：]\s*[【\[]\s*(\d+)\s*[】\]]/);
    if(!m) return null;
    return { name: m[1].trim() || '均码', qty: parseInt(m[2],10) };
  }
  trs.forEach(function(tr){
    var tds = tr.querySelectorAll('td');
    if(!tds.length) return;
    var texts = Array.prototype.map.call(tds, function(td){ return td.textContent.replace(/\s+/g,' ').trim(); });
    var first = texts[0]||'';
    if(!first || first.indexOf('--')===0 || first==='商品名称') return;
    var m = first.match(/^(\d+)([\s\S]*)/);
    if(m && texts.length>=3){
      var rest = m[2];
      var half = Math.floor(rest.length/2);
      var name = (rest.slice(0,half)===rest.slice(half)) ? rest.slice(0,half).trim() : rest.trim();
      var codeM = name.match(/([A-Za-z]{1,3}\d{3,8}(-\d+)?)\s*$/);
      cur = { name:name, code: codeM?codeM[1]:'', items:[] };
      products.push(cur);
      var it = parseSpec(texts[1]||'');
      if(it) cur.items.push(it);
    } else if(cur){
      var it2 = parseSpec(texts[0]||'');
      if(it2) cur.items.push(it2);
    }
  });
  return products.filter(function(p){ return p.items.length; });
}

function planImport(products){
  var plan = products.map(function(p){
    var key = p.code || p.name;
    var target = null;
    state.styles.forEach(function(st){
      if(target) return;
      if(p.code && st.code && st.code===p.code) target = st;
      else if(!p.code && st.name===p.name) target = st;
    });
    return { product:p, key:key, target:target, isNew: !target, total: p.items.reduce(function(a,b){return a+b.qty;},0) };
  });
  return plan;
}

function commitImport(plan){
  var created=0, updated=0, sizesTouched=0;
  plan.forEach(function(row){
    var st = row.target;
    if(!st){
      st = { id:uid(), createdAt:Date.now(), archived:false, sizes:[], shippedTotal:0, returnedTotal:0,
             name:row.product.name, code:row.product.code, cost:0, resaleRate:90, buffer:0 };
      state.styles.push(st);
      created++;
    } else updated++;
    row.product.items.forEach(function(it){
      var s = null;
      st.sizes.forEach(function(z){ if(z.name===it.name) s = z; });
      if(!s){ s = { name:it.name, pending:0, returning:0, stock:0, inProd:0 }; st.sizes.push(s); }
      s.pending = it.qty;
      sizesTouched++;
    });
    persist(st);
  });
  render();
  toast('导入完成：新建 '+created+' 款，更新 '+updated+' 款，共 '+sizesTouched+' 个尺码');
}

function openImportModal(){
  modal('<h3>导入备货单</h3>'
   +'<label class="drop" id="dropZone"><div class="big">📄</div>把导出的备货单文件拖到这里，或点击选择<br>'
     +'<span style="font-size:11.5px">支持抖音后台导出的 .xlsx / .html / .csv</span>'
     +'<input type="file" id="fileInput" accept=".xlsx,.html,.htm,.csv,.xls"></label>'
   +'<div class="hint" style="margin-top:8px">识别不了文件的话，也可以直接把表格内容复制粘贴到这里：</div>'
   +'<textarea id="pasteArea" rows="3" placeholder="从表格里全选复制，粘贴到这里"></textarea>'
   +'<div class="mact"><button class="btn" data-x="close">取消</button><button class="btn primary" id="parseBtn">解析</button></div>',
  function(root, close){
    var fileInput = root.querySelector('#fileInput');
    var drop = root.querySelector('#dropZone');
    var pasteArea = root.querySelector('#pasteArea');
    var pendingText = '';

    function readFile(f){
      if(!f) return;
      var reader = new FileReader();
      reader.onload = function(){ pendingText = String(reader.result||''); toast('已读取「'+f.name+'」，点击解析'); };
      reader.onerror = function(){ toast('文件读取失败，试试复制粘贴表格内容'); };
      reader.readAsText(f, 'utf-8');
    }
    fileInput.onchange = function(){ readFile(fileInput.files[0]); };
    drop.ondragover = function(e){ e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = function(){ drop.classList.remove('over'); };
    drop.ondrop = function(e){ e.preventDefault(); drop.classList.remove('over'); readFile(e.dataTransfer.files[0]); };

    root.querySelector('#parseBtn').onclick = function(){

      var plan = planImport(products);
      close();
      showImportPreview(plan);
    };
  });
}

function csv(){
  var o=['款式,货号,尺码,待发货,退货中,库存,在产,建议生产,过量,成本'];
  state.styles.forEach(function(st){var c=calcStyle(st);

      o.push([st.name,st.code||'',s.name,x.pending,x.returning,x.stock,x.inProd,x.suggest,x.over,n(st.cost)]
        .map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(','));});});
  return '\uFEFF'+o.join('\n');
}

state.styles=lsLoad();
render();

if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('db').then(function(db){
    if(!db)return; DB=db;
    db.collection('styles').onSnapshot(function(snap){
      var remote=[];
      (snap.docs||[]).forEach(function(d){
        if(!d.exists)return;
        var v;try{v=JSON.parse(JSON.stringify(d.data()||{}));}catch(e){return;}
        v.id=d.id; if(!v.sizes||!v.sizes.length)return;
        if(tombs[v.id])return;
        if(v.sizes[0].pending==null) v=migrate([v])[0];
        remote.push(v);
      });
      if(!state.ready){
        state.ready=true;
        if(!remote.length&&state.styles.length){state.styles.forEach(persist);return;}
      }
      if(JSON.stringify(remote)===JSON.stringify(state.styles))return;
      if(editing)return;
      state.styles=remote;lsSave();render();
    },function(){});
  },function(){});
  window.claude.use('downloads').then(function(d){if(d)window._dl=d;},function(){});
}
})();
</script>
</body>
</html>
